{% extends "menu.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ static_v('create-payment.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock %}

{% block content %}
<div class="dn2-page">

<div class="dn2-top">
      <h2 class="dn2-title">Create Payment</h2>
  </div>
sdfg\sfghgsdgfhsdfsdf
      sdfsdfdsfdsf
      sdfsdfsdf
      sdfsdfsdf
<div class="dn2-card">

<div class="dn2-form">
      <!-- Row 1: Payment Id + customer Name -->
  <div class="dn2-row">
       <div class="dn2-field">
    <label>Payment Id</label>
    <input type="text" id="paymentId" value="{{ payment_id_display }}" disabled>
       </div>

<div class="dn2-field">
    <label>Customer Name</label>
    <div class="custom-dropdown" id="customerDropdown">
        <div class="dropdown-selected" id="customerSelected">Select Customer</div>
        <div class="dropdown-options" id="customerOptions"></div>
    </div>
    <input type="hidden" id="customerValue" value="">
</div>
</div>

<!-- Row 2: Transaction ID + Invoice Id (now dropdown) -->
 <div class="dn2-row">
        <div class="dn2-field">
          <label>Date</label>
          <input type="date" id="paymentDate">
        </div>
        
        <!-- Invoice ID -->
       <div class="dn2-field">
          <label>Invoice Id</label>
          <input type="text" id="invoiceId" value="" disabled>
        </div>
</div>

<!-- Row 3: Balance Due +  Payment Method-->

         <div class="dn2-row">
        <div class="dn2-field ">
          <label>Balance Due</label>
          <input type="text" id="balanceDue" disabled>
        </div>

        <div class="dn2-field">
        <label>Payment Method</label>
        <input id="paymentMethod" placeholder="Payment method" disabled>
        </div>
      </div>


      <!-- Row 4: Amount + Transction Id -->
<div class="dn2-row">
        <div class="dn2-field">
          <label>Amount (₹)</label>
          <input type="text" id="amount" placeholder="0.00">
        </div>
         <div class="dn2-field">
          <label>Transaction ID</label>
          <input type="text" id="transactionId" placeholder="UP0123456789">
        </div>
</div>


      <!-- Row : Notes -->
      <div class="dn2-row">
        <div class="dn2-field dn2-full">
          <label>Notes (Optional)</label>
          <textarea id="notes" placeholder="Enter Notes Here..."></textarea>
        </div>
      </div>
</div>

<div class="dn2-footer">
      <div class="footer-icon-bar">
      </div>
      <div class="dn2-right-actions">
        <button type="button" class="dn2-button btn-outline" id="cancelPaymentBtn">Cancel</button>
        <button type="button" class="dn2-button btn-submit" id="savePaymentBtn" data-rbac-preserve-disabled="1" disabled>Save Payment</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div id="successToast" class="success-notification">Payment saved successfully!</div>
<div id="errorToast" class="error-notification">Please fix validation errors</div>


{% endblock %}

{% block extra_js %}
<script src="{{ static_v('create-payment.js') }}"></script>
{% endblock %}
