<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neo Galaxy ERP | Edit Product</title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">



    <!-- FONT AWESOME -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">



    <!-- EDIT CSS -->

    <link rel="stylesheet" href="edit-product.css">


</head>



<body>



    <!--=================================
        BACKGROUND EFFECTS
==================================-->


    <div class="background">


        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

        <div class="circle circle4"></div>


    </div>





    <!--=================================
          EDIT PRODUCT
==================================-->


    <section class="edit-master">





        <!-- HEADER -->

        <div class="header-card">



            <div class="left-content">


                <h1>

                    <i class="fa-solid fa-pen-to-square"></i>

                    Edit Product

                </h1>



                <p>

                    Update product information and save changes

                </p>


            </div>




            <div class="right-content">


                <button>
                    <a href="product.html">back</a>

                </button>


            </div>



        </div>







        <!-- FORM BOX -->


        <div class="edit-box">





            <div class="form-grid">





                <!-- PRODUCT ID -->

                <div class="form-group">


                    <label>
                        Product ID
                    </label>


                    <input type="text" id="productId" readonly>


                </div>






                <!-- PRODUCT NAME -->


                <div class="form-group">


                    <label>
                        Product Name
                    </label>


                    <input type="text" id="productName" placeholder="Enter product name">


                </div>







                <!-- COMPANY -->


                <div class="form-group">


                    <label>
                        Company
                    </label>


                    <input type="text" id="company" placeholder="Enter company name">


                </div>







                <!-- TYPE -->


                <div class="form-group">


                    <label>
                        Product Type
                    </label>


                    <select id="type">


                        <option value="Laptop">
                            Laptop
                        </option>


                        <option value="Accessories">
                            Accessories
                        </option>


                        <option value="Monitor">
                            Monitor
                        </option>


                        <option value="Printer">
                            Printer
                        </option>



                    </select>


                </div>







                <!-- PRICE -->


                <div class="form-group">


                    <label>
                        Price
                    </label>


                    <input type="text" id="price" placeholder="Enter price">


                </div>








                <!-- STOCK -->


                <div class="form-group">


                    <label>
                        Stock Quantity
                    </label>


                    <input type="number" id="stock" placeholder="Enter stock">


                </div>








                <!-- STATUS -->


                <div class="form-group">


                    <label>
                        Status
                    </label>


                    <select id="status">


                        <option value="Active">
                            Active
                        </option>


                        <option value="Inactive">
                            Inactive
                        </option>


                    </select>


                </div>









                <!-- IMAGE -->


                <div class="form-group">


                    <label>
                        Product Image URL
                    </label>


                    <input type="text" id="image" placeholder="Paste image URL">


                </div>





            </div>








            <!-- IMAGE PREVIEW -->











            <!-- BUTTONS -->


            <div class="bottom-section">


                <div class="preview-box">


                    <h3>
                        Image Preview
                    </h3>


                    <img id="previewImage" src="https://placehold.co/120x120" alt="Product Preview">


                </div>



                <div class="action-buttons">


                    <button class="save-btn" type="button" onclick="saveProduct()">

                        Save Changes

                    </button>


                </div>



            </div>





        </div>







        </div>






    </section>







    <!-- JAVASCRIPT -->


    <script src="edit-product.js"></script>



</body>

</html>
