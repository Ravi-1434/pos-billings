<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Neo Galaxy ERP | Add Product
    </title>


    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">



    <!-- FONT AWESOME -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">



    <!-- CSS -->

    <link rel="stylesheet" href="add.css">


</head>



<body>



    <!-- BACKGROUND -->

    <div class="background">

        <div class="circle circle1"></div>

        <div class="circle circle2"></div>

        <div class="circle circle3"></div>

        <div class="circle circle4"></div>


    </div>





    <!-- ADD PRODUCT PAGE -->


    <section class="add-product-page">





        <!-- HEADER -->


        <div class="top-card">


            <div>

                <h1>



                    Add New Product

                </h1>


                <p>

                    Create new product details for inventory management.

                </p>


            </div>



            <a href="product.html">

                <button class="back-btn" onclick="window.location.href='product.html'">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </button>
            </a>



        </div>







        <!-- FORM CARD -->


        <div class="form-card">



            <form id="productForm">





                <div class="form-grid">



                    <div class="input-box">


                        <label>

                            Product Name

                        </label>


                        <input type="text" id="productName" placeholder="Enter product name" required>


                    </div>





                    <div class="input-box">


                        <label>

                            Company Name

                        </label>


                        <input type="text" id="companyName" placeholder="Enter company name" required>


                    </div>





                    <div class="input-box">


                        <label>

                            Product Type

                        </label>


                        <select id="productType">


                            <option>
                                Laptop
                            </option>


                            <option>
                                Printer
                            </option>


                            <option>
                                Monitor
                            </option>


                            <option>
                                Accessories
                            </option>


                            <option>
                                Software
                            </option>


                        </select>


                    </div>







                    <div class="input-box">


                        <label>

                            Price

                        </label>


                        <input type="number" id="productPrice" placeholder="Enter price" required>


                    </div>







                    <div class="input-box">


                        <label>

                            Stock Quantity

                        </label>


                        <input type="number" id="productStock" placeholder="Enter stock" required>


                    </div>







                    <div class="input-box">


                        <label>

                            Status

                        </label>


                        <select id="productStatus">


                            <option>
                                Active
                            </option>


                            <option>
                                Inactive
                            </option>


                        </select>


                    </div>







                    <div class="input-box full">


                        <label>

                            Product Image URL

                        </label>


                        <input type="text" id="productImage" placeholder="Enter image URL">


                    </div>





                </div>







                <!-- BUTTONS -->


                <div class="form-buttons">



                    <button type="submit" class="save-btn">


                        add product



                    </button>








                </div>






            </form>





        </div>







        <!-- FOOTER -->


        <div class="footer">


            Neo Galaxy ERP Product Management System


        </div>





    </section>




    <div id="successMessage" class="success-message">

        Product Added Successfully!

    </div>


    <script src="add.js"></script>



</body>

</html>
